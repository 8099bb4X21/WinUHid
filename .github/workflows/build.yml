name: Build WinUHid (UMDF 2.23 compat)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build x64
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet WDK + SDK packages
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Verify WDK props
        shell: pwsh
        run: |
          Write-Host "=== packages ==="
          Get-ChildItem "packages" -Directory | Select-Object -ExpandProperty Name
          Write-Host "=== WDK props ==="
          Get-ChildItem "packages" -Recurse -Filter "Microsoft.Windows.WDK.x64.props" | Select-Object -ExpandProperty FullName
          Write-Host "=== stampinf in package ==="
          Get-ChildItem "packages" -Recurse -Filter "stampinf.exe" | Select-Object -ExpandProperty FullName

      - name: Add WDK tools to PATH
        shell: pwsh
        run: |
          $stamp = Get-ChildItem "packages" -Recurse -Filter "stampinf.exe" | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $stamp) { $stamp = Get-ChildItem "packages" -Recurse -Filter "stampinf.exe" | Select-Object -First 1 -ExpandProperty FullName }
          $dir = Split-Path $stamp
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "WDK tools dir added to PATH: $dir"
          # InfVerif 按相对路径 x86\InfVerif.dll 加载（基准=msbuild 工作目录=仓库根），把包里的 x86 目录拷到仓库根
          $infverif = Get-ChildItem "packages" -Recurse -Filter "InfVerif.dll" | Where-Object { $_.FullName -match "\\x86\\" } | Select-Object -First 1
          if ($infverif) {
            $x86src = $infverif.DirectoryName
            Copy-Item $x86src "$env:GITHUB_WORKSPACE\x86" -Recurse -Force
            Write-Host "copied $x86src to workspace x86"
          } else {
            Write-Host "WARN: no x86 InfVerif.dll found in packages"
            Get-ChildItem "packages" -Recurse -Filter "InfVerif*" | Select-Object -ExpandProperty FullName
          }
          $vhf = Get-ChildItem "packages" -Recurse -Filter "VhfUm.lib" | Select-Object -ExpandProperty FullName
          Write-Host "VhfUm.lib locations:"; $vhf | ForEach-Object { Write-Host "  $_" }

      - name: Build WinUHid.dll (user-mode lib)
        shell: pwsh
        run: msbuild "WinUHid\WinUHid.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$env:GITHUB_WORKSPACE\" /m /verbosity:minimal

      - name: Build WinUHidDriver.dll (UMDF 2.23)
        shell: pwsh
        run: |
          $vhf = Get-ChildItem "packages" -Recurse -Filter "VhfUm.lib" | Select-Object -First 1 -ExpandProperty DirectoryName
          $env:LIB = "$vhf;$env:LIB"
          Write-Host "LIB=$env:LIB"
          msbuild "WinUHid Driver\WinUHid Driver.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$env:GITHUB_WORKSPACE\" /m /verbosity:minimal

      - name: List outputs
        shell: pwsh
        run: |
          Write-Host "=== build outputs ==="
          Get-ChildItem "build" -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Write-Host "=== inf UmdfLibraryVersion ==="
          Get-ChildItem "build" -Recurse -Filter "*.inf" | ForEach-Object { Write-Host "--- $($_.FullName)"; Select-String -Path $_.FullName -Pattern "UmdfLibraryVersion|DriverVer" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winuhid-x64
          path: build/
          if-no-files-found: warn
