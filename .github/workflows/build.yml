name: Build WinUHid (UMDF 2.23 compat)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build x64
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: 探测 SDK 与 WDK 安装渠道
        shell: pwsh
        run: |
          Write-Host "=== SDK Include 版本 ==="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "=== winget 版本 ==="
          winget --version
          Write-Host "=== winget 可用的 Windows WDK ==="
          winget search --query "Windows WDK" --source winget --accept-source-agreements 2>&1 | Out-String

      - name: 安装 WDK (winget)
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsWDK.10.0.26100 --accept-source-agreements --accept-package-agreements --silent --disable-interactivity 2>&1 | Out-String

      - name: 验证 stampinf 与 wdf.h
        shell: pwsh
        run: |
          Write-Host "=== stampinf ==="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter stampinf.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "=== wdf.h ==="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Recurse -Filter wdf.h -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

      - name: 编译用户态库 WinUHid.dll
        shell: pwsh
        run: msbuild "WinUHid\WinUHid.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$env:GITHUB_WORKSPACE\" /m /verbosity:minimal

      - name: 编译驱动 WinUHidDriver.dll
        shell: pwsh
        run: msbuild "WinUHid Driver\WinUHid Driver.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$env:GITHUB_WORKSPACE\" /m /verbosity:minimal

      - name: 产物清单
        shell: pwsh
        run: |
          Write-Host "=== build 目录产物 ==="
          Get-ChildItem "build" -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: winuhid-x64
          path: build/
          if-no-files-found: warn